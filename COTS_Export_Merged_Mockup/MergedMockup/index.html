<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COTS — Integrated Mockup (Core · Shared · Export)</title>
    <!--
      No external stylesheet or font is loaded: the built app has to run from a folder with no
      network, the same way the Export contribution's portable file does.
    -->
    <!--
      An inline icon, for the same reason. With no icon declared the browser requests /favicon.ico by
      itself on every first load, gets a 404 off the dev server and logs a console error — which made
      `node walk.mjs` report one failure on every run and had nothing to do with the application. A
      data URI keeps the single-file, no-network guarantee that the rest of this page is built around.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B283C'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='bold' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E"
    />
    <style>
      html,body,#root{height:100%;margin:0}
      body{font-family:Roboto,-apple-system,"Segoe UI",Arial,sans-serif}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
